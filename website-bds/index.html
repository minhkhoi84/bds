<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Bất Động Sản</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  {{> header}}

  <!-- HERO / BANNER SECTION -->
<section class="hero-section pb-3 pb-md-0">
  <!-- 1. Ảnh Banner & Slider Dots -->
  <div class="hero-banner">
    <img src="/images/hero-banner.svg" alt="Dự án nổi bật" class="hero-banner-img" />
  </div>

  <!-- 2. Chấm slide + Khung Tìm Kiếm (Frame 31, đè lên chân banner) -->
  <div class="container hero-search-container">
    <!-- Các chấm chuyển slide (carousel indicators) -->
    <div class="hero-dots d-flex align-items-center justify-content-center">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <form class="hero-search-box">
      <div class="hero-search-fields">
        <!-- Input tìm kiếm theo tên -->
        <div class="search-field-name">
          <div class="search-input-wrapper">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8c94a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="form-control" placeholder="Tìm kiếm dự án" enterkeyhint="search" />
          </div>
        </div>

        <!-- Nút mở bộ lọc (chỉ mobile) -->
        <button type="button" class="hero-filter-btn d-md-none" aria-label="Bộ lọc" aria-expanded="false">
          <svg class="icon-filter" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
          <svg class="icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <!-- Dropdown Chủ đầu tư -->
        <div class="search-field">
          <select class="form-select">
            <option selected>Tất cả chủ đầu tư</option>
            <option value="1">Vingroup</option>
            <option value="2">Sun Group</option>
            <option value="3">Novaland</option>
          </select>
        </div>

        <!-- Dropdown Khu vực -->
        <div class="search-field">
          <select class="form-select">
            <option selected>Tất cả khu vực</option>
            <option value="hn">Hà Nội</option>
            <option value="hcm">TP. Hồ Chí Minh</option>
            <option value="pq">Phú Quốc</option>
            <option value="dn">Đà Nẵng</option>
          </select>
        </div>

        <!-- Dropdown Loại hình -->
        <div class="search-field">
          <select class="form-select">
            <option selected>Tất cả loại hình</option>
            <option value="can-ho">Căn hộ</option>
            <option value="biet-thu">Biệt thự</option>
            <option value="shophouse">Shophouse</option>
            <option value="dat-nen">Đất nền</option>
          </select>
        </div>

        <!-- Dropdown Trạng thái -->
        <div class="search-field">
          <select class="form-select">
            <option selected>Tất cả trạng thái</option>
            <option value="sap-mo-ban">Sắp mở bán</option>
            <option value="dang-mo-ban">Đang mở bán</option>
            <option value="da-ban-giao">Đã bàn giao</option>
          </select>
        </div>
      </div>
    </form>
  </div>
</section>

<main class="main-content">
  <div class="container main-content-container">
    <div class="main-content-layout">
      <!-- CỘT TRÁI: DANH SÁCH DỰ ÁN + TIN TỨC -->
      <div class="main-content-left">
      <section class="project-list-section">
        <h2 class="section-heading">DANH SÁCH DỰ ÁN</h2>

        <!-- Vùng chứa nạp động qua TS -->
        <div class="row g-3" id="project-list-container"></div>

        <!-- PHÂN TRANG: render động qua TS (components/pagination.ts) -->
        <nav class="project-pagination d-flex flex-wrap align-items-center justify-content-between gap-3"
             id="project-pagination" aria-label="Phân trang dự án"></nav>
      </section>

      <!-- TIN TỨC -->
      <section class="news-section">
        <div class="news-section__header">
          <h2 class="section-heading">TIN TỨC</h2>
          <a href="/tin-tuc" class="news-section__more">Xem tất cả <i class="bi bi-arrow-right"></i></a>
        </div>
        <!-- Vùng chứa nạp động qua TS -->
        <div class="row g-3 news-list" id="news-list-container"></div>
      </section>
      </div>

      <!-- CỘT PHẢI: DỰ ÁN HOT -->
      <aside class="hot-projects-section">
        <h2 class="section-heading">DỰ ÁN HOT</h2>
        <!-- Vùng chứa nạp động qua TS -->
        <div class="hot-projects-list" id="hot-projects-container"></div>
      </aside>
    </div>
  </div>
</main>

  {{> footer}}

  <!-- THÊM DÒNG NÀY VÀO TRƯỚC </body> ĐỂ VITE NẠP SCSS & SCRIPT -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
